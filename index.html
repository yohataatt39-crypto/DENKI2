<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132238"><title>施工経験記述トレーニング</title><link rel="stylesheet" href="style.css"></head><body>
<header><small>1級電気工事施工管理技士 二次試験</small><h1>施工経験記述トレーニング</h1><span>Version 1.0</span></header>
<main><section class="intro"><p>与条件を選び、問題点と対策を自分で記述してから、着眼点や作成済みの記述例と比較します。</p></section>
<section class="filters"><select id="category"></select><select id="topic"></select></section>
<article class="card"><div id="cat" class="tag"></div><h2 id="title"></h2>
<h3>自分で記述する</h3><label>予測・検討した問題点</label><textarea id="problem" placeholder="工事の状況と、工程・安全・品質上の問題点を記述"></textarea>
<label>実施する対策</label><textarea id="measure" placeholder="問題点に対して行う具体的な対策を記述"></textarea>
<div class="buttons"><button id="show" class="primary">着眼点・記述例を見る</button><button id="clear">入力をクリア</button></div>
<div id="reference" hidden><h3>記述の着眼点</h3><ol id="points"></ol><div id="examples"></div></div></article>
<section class="tips"><h3>記述の組み立て</h3><p><b>工事状況 → 問題点 → 具体的対策 → 管理上の効果</b>の順にすると、対策を採用した理由が伝わりやすくなります。</p></section></main>
<footer>Version 1.0 / 施工経験記述専用</footer><script src="app.js?v=1.0"></script></body></html>
